<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problemas de Química - Soluciones Detalladas</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>

    <script>
        // Configuración didáctica de base para SmilesDrawer
        const opcionesDibujoBase = {
            width: 180,
            height: 130,
            bondThickness: 2,
            fontSizeLarge: 14,
            fontSizeSmall: 10,
            shortBonds: true,
            explicitHydrogens: true,
            terminalCarbons: true,
            allAtomsExplicit: true, // Muestra cada átomo 'C' y 'H' en la cadena
            compactDrawing: false,
            // --- NUEVAS PROPIEDADES PARA CORREGIR LA INCLINACIÓN ---
            orient: 'horizontal', 
            isometric: true  
        };

        function dibujarMoleculasSmiles() {
            // Buscamos todos los elementos con el atributo data-smiles
            document.querySelectorAll('[data-smiles]').forEach(contenedor => {
                const smiles = contenedor.getAttribute('data-smiles');
                if (!smiles) return;

                // Averiguamos si está en la zona de solución
                const esSolucion = contenedor.closest('#caja-solucion') || contenedor.getAttribute('data-solucion') === "true";

                // Si ya contiene un canvas y NO es de la zona de solución, nos saltamos para evitar duplicar.
                // Si es de la solución, comprobamos si su paso contenedor ya es visible en el DOM.
                if (contenedor.querySelector('canvas')) {
                    if (!esSolucion) return; // Enunciado ya dibujado, salir.
                    
                    // Si es solución pero el paso padre sigue oculto (display: none), no lo dibujamos todavía
                    const pasoPadre = contenedor.closest('.paso');
                    if (pasoPadre && !pasoPadre.classList.contains('visible')) return;
                }

                // Clonamos la configuración base para no arrastrar configuraciones previas
                const opcionesConfiguradas = JSON.parse(JSON.stringify(opcionesDibujoBase));

                // Definimos los colores dependiendo de si es solución o enunciado
                let colorBase = '#000000'; // Por defecto azul oscuro / negro para enunciados
                if (esSolucion) {
                    colorBase = '#c01a1a'; // Rojo para soluciones
                } else if (contenedor.getAttribute('data-solucion') === "false") {
                    colorBase = '#000000'; // Negro
                }

                // Creamos un tema personalizado exclusivo para esta molécula
                opcionesConfiguradas.themes = {
                    light: {
                        C: colorBase,
                        H: colorBase,
                        O: colorBase,
                        N: colorBase,
                        Cl: colorBase,
                        Br: colorBase,
                        F: colorBase,
                        I: colorBase,
                        P: colorBase,
                        S: colorBase,
                        BACKGROUND: 'transparent'
                    }
                };

                // Vaciamos el contenedor antes de inyectar el nuevo lienzo
                contenedor.innerHTML = '';

                try {
                    // Creamos dinámicamente un lienzo Canvas con las dimensiones configuradas
                    const canvas = document.createElement('canvas');
                    canvas.width = opcionesConfiguradas.width;
                    canvas.height = opcionesConfiguradas.height;
                    contenedor.appendChild(canvas);

                    // Inicializamos una instancia nueva y limpia del Drawer con la paleta de color correspondiente
                    const drawer = new SmilesDrawer.Drawer(opcionesConfiguradas);

                    // Procesamos y renderizamos la molécula de inmediato
                    SmilesDrawer.parse(smiles.trim(), function(tree) {
                        drawer.draw(tree, canvas, 'light', false);
                    }, function(err) {
                        console.error("Error analizando el SMILES: " + smiles, err);
                    });

                } catch (error) {
                    console.error("Error crítico en contenedor SMILES: ", error);
                }
            });
        }
    </script>

    <style>
        /* --- ESTILOS GENERALES Y LAYOUT --- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #2c3e50;
            background-color: #f0f4f8;
            overflow: hidden; 
        }

        .pagina-completa {
            display: flex;
            flex-direction: column;
            height: 100vh; 
        }

        /* --- ZONA SUPERIOR: EL MENÚ --- */
        .zona-menu {
            flex: 0 0 auto; 
            background-color: #ffffff; 
            padding: 15px 3%; 
            border-bottom: 1px solid #d1d8e0;
            z-index: 1000; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h1 {
            margin: 0 0 15px 0; 
            text-align: center;
            font-size: 26px; 
            color: #34495e;
        }

        .contenedor-menus {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px; 
            align-items: center;
            width: 100%;           
            overflow-x: auto;
            padding-bottom: 12px;
            justify-content: flex-start; 
        }

        .menu-desplegable {
            flex: 0 0 auto;
            width: auto; 
            padding: 12px 10px; 
            border-radius: 8px;
            border: 1px solid #ced4da;
            font-size: 15px; 
            font-weight: 600;
            color: #495057;
            background-color: #f8f9fa;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-desplegable:hover {
            border-color: #3498db;
            background-color: #ffffff;
        }

        .menu-desplegable.menu-activo {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.4);
        }

        /* --- ZONA INFERIOR --- */
        .zona-lectura {
            flex: 1 1 auto; 
            overflow-y: auto; 
            padding: 10px 5%; 
            background-color: #f1f3f5; 
        }

        #caja-visor {
            background: #ffffff;
            padding: 50px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 6px solid #3498db; 
            min-height: 80%; 
        }

        #mensaje-inicial {
            text-align: center;
            color: #95a5a6;
            font-size: 20px; 
            margin-top: 50px;
        }

        #contenido-problema { display: none; }
        #titulo-visor { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-top: 0; }
        #texto-visor { font-size: 20px; line-height: 1.8; margin-top: 25px; } 
        
        .controles-solucion { display: flex; justify-content: center; margin-top: 40px; }
        #btn-solucion { display: none; padding: 15px 35px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #btn-solucion:hover { filter: brightness(1.1); }
        
        #caja-solucion { display: none; margin-top: 35px; padding: 30px; background-color: #fdfdfd; border: 1px solid #e9ecef; border-left: 6px solid #27ae60; color: #2c3e50; font-size: 19px; line-height: 1.8; }

        #caja-solucion .paso {
            display: none; 
            margin-bottom: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            animation: aparecer 0.4s ease-out;
        }

        #caja-solucion .paso.visible {
            display: block; 
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos de las tablas */
        .tabla-ejercicios, .tabla-ejercicios-solucion {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tabla-ejercicios th { background-color: #2c3e50; color: white; padding: 12px; text-align: left; }
        .tabla-ejercicios-solucion th { background-color: #27ae60; color: white; padding: 12px; text-align: left; }
        .tabla-ejercicios td, .tabla-ejercicios-solucion td { padding: 10px; border-bottom: 1px solid #ddd; vertical-align: middle; }
        .tabla-ejercicios td:nth-child(odd) { font-weight: bold; color: #e74c3c; width: 40px; }
        .tabla-ejercicios tr:nth-child(even), .tabla-ejercicios-solucion tr:nth-child(even) { background-color: #f9f9f9; }
        
        [data-smiles] { display: inline-block; min-width: 180px; min-height: 130px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="pagina-completa">
        <header class="zona-menu">
            <h1>👨‍🏫 Cuaderno de Química - Química del carbono</h1>
            <div class="contenedor-menus">
                <select class="menu-desplegable" id="menu-hidrocarburos"><option value="" disabled selected>📁 1. Hidrocarburos</option></select>
                <select class="menu-desplegable" id="menu-oxigeno"><option value="" disabled selected>📁 2. Compuestos oxigenados y nitrogenados</option></select>
                <select class="menu-desplegable" id="menu-variados"><option value="" disabled selected>📁 3. Compuestos variados</option></select>
            </div>
        </header>

        <main class="zona-lectura">
            <div id="caja-visor">
                <div id="mensaje-inicial"><p>Selecciona un tema arriba para visualizar los problemas.</p></div>
                <div id="contenido-problema">
                    <h2 id="titulo-visor"></h2>
                    <div id="texto-visor"></div>
                    <div class="controles-solucion">
                        <button id="btn-solucion" onclick="toggleSolucion()">Ver Solución</button>
                        <button id="btn-siguiente-paso" onclick="revelarSiguientePaso()" style="display: none; padding: 15px 35px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-left: 15px;">Siguiente Paso ⬇️</button>
                    </div>
                    <div id="caja-solucion"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="datos.js"></script>

    <script>
        function ajustarAnchoSoloTitulo(select) {
            const textoTitulo = select.options[0].text;
            const font = window.getComputedStyle(select).font;
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            context.font = font;
            const width = context.measureText(textoTitulo).width;
            select.style.width = (width + 45) + "px";
        }

        function inicializarMenus() {
            if (typeof baseDatosProblemas === 'undefined') return;

            const todosLosMenus = document.querySelectorAll('.menu-desplegable');

            for (const categoria in baseDatosProblemas) {
                const selectMenu = document.getElementById(`menu-${categoria}`);
                if (selectMenu) {
                    baseDatosProblemas[categoria].forEach((prob, index) => {
                        const opcion = document.createElement('option');
                        opcion.value = index; 
                        opcion.text = prob.titulo; 
                        selectMenu.appendChild(opcion);
                    });

                    ajustarAnchoSoloTitulo(selectMenu);

                    selectMenu.addEventListener('change', function() {
                        if (this.value !== "") {
                            const prob = baseDatosProblemas[categoria][this.value];
                            mostrarEnunciado(prob.titulo, prob.enunciado, prob.solucion);
                            this.selectedIndex = 0; 
                            todosLosMenus.forEach(m => m.classList.remove('menu-activo'));
                            this.classList.add('menu-activo');
                        }
                    });
                }
            }
        }

        function mostrarEnunciado(titulo, texto, solucionHTML) {
            document.getElementById('mensaje-inicial').style.display = 'none';
            document.getElementById('contenido-problema').style.display = 'block';
            document.getElementById('caja-solucion').style.display = 'none';
            
            const btnSiguiente = document.getElementById('btn-siguiente-paso');
            if (btnSiguiente) btnSiguiente.style.display = 'none';

            document.getElementById('titulo-visor').innerText = titulo;
            document.getElementById('texto-visor').innerHTML = texto;
            
            const btn = document.getElementById('btn-solucion');
            if (solucionHTML) {
                document.getElementById('caja-solucion').innerHTML = solucionHTML;
                btn.style.display = 'inline-block';
                btn.innerText = 'Ver Solución';
            } else {
                btn.style.display = 'none';
            }
            
            MathJax.typesetPromise();
            
            // Dibujamos las moléculas del enunciado inmediatamente
            dibujarMoleculasSmiles();

            document.querySelector('.zona-lectura').scrollTop = 0;
        }

        function toggleSolucion() {
            const caja = document.getElementById('caja-solucion');
            const btn = document.getElementById('btn-solucion');
            const btnSiguiente = document.getElementById('btn-siguiente-paso');

            if (caja.style.display === 'none') {
                caja.style.display = 'block';
                btn.innerText = 'Ocultar Solución';
                btnSiguiente.style.display = 'inline-block';
                btnSiguiente.innerText = "Mostrar primer paso ⬇️";
                btnSiguiente.disabled = false;
                btnSiguiente.style.backgroundColor = "#3498db";
                btnSiguiente.style.cursor = "pointer";
                document.querySelectorAll('#caja-solucion .paso').forEach(p => p.classList.remove('visible'));
                
                MathJax.typesetPromise();
                
                // Llamamos a dibujar (solo pintará aquellas soluciones cuyo paso sea visible, o refrescará las globales)
                dibujarMoleculasSmiles();
            } else {
                caja.style.display = 'none';
                btn.innerText = 'Ver Solución';
                btnSiguiente.style.display = 'none';
            }
        }

        function revelarSiguientePaso() {
            const contenedor = document.getElementById('caja-solucion');
            const boton = document.getElementById('btn-siguiente-paso');
            const siguientePaso = contenedor.querySelector('.paso:not(.visible)');
            
            if (siguientePaso) {
                siguientePaso.classList.add('visible'); 
                boton.innerText = "Siguiente paso ⬇️";

                // Retraso de renderizado asíncrono para asegurar visibilidad física en el DOM
                setTimeout(() => {
                    dibujarMoleculasSmiles();
                }, 30);

                const pasosRestantes = contenedor.querySelector('.paso:not(.visible)');
                if (!pasosRestantes) {
                    boton.innerText = "¡Solución completada!";
                    boton.disabled = true;
                    boton.style.backgroundColor = "#95a5a6";
                    boton.style.cursor = "default";
                }
            }
        }

        window.onload = inicializarMenus;
    </script>
</body>
</html>
