<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problemas de Química - Soluciones Detalladas</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script src="https://www.chemdoodle.com/demos/install/ChemDoodleWeb.js"></script>
    
    <script src="datos.js"></script>

    <script>
        // ===== CONFIGURACIÓN CHEMDOODLE =====
        const ANCHO_MOLECULE = 300;
        const ALTO_MOLECULE = 250;
        
        // Esperar a que ChemDoodle cargue
        function esperarChemDoodle() {
            return new Promise((resolve) => {
                let intentos = 0;
                const comprobar = () => {
                    intentos++;
                    if (typeof ChemDoodle !== 'undefined' && ChemDoodle.readSMILES) {
                        console.log('✓ ChemDoodle Web cargado correctamente');
                        resolve(true);
                    } else if (intentos < 100) {
                        setTimeout(comprobar, 50);
                    } else {
                        console.error('✗ ChemDoodle Web no cargó después de 5 segundos');
                        resolve(false);
                    }
                };
                comprobar();
            });
        }

        function dibujarMoleculasChemDoodle() {
            if (typeof ChemDoodle === 'undefined' || !ChemDoodle.readSMILES) {
                console.warn('⚠ ChemDoodle Web no está disponible aún');
                setTimeout(dibujarMoleculasChemDoodle, 100);
                return;
            }

            console.log('🔬 Dibujando moléculas con ViewerCanvas...');
            let conteoMoleculas = 0;

            document.querySelectorAll('[data-smiles]').forEach((contenedor, index) => {
                const smiles = contenedor.getAttribute('data-smiles');
                if (!smiles) return;

                if (contenedor.hasAttribute('data-rendered')) {
                    return;
                }

                const esSolucion = contenedor.closest('#caja-solucion') || contenedor.getAttribute('data-solucion') === "true";
                
                if (esSolucion) {
                    const pasoPadre = contenedor.closest('.paso');
                    if (pasoPadre && !pasoPadre.classList.contains('visible')) {
                        return;
                    }
                }

                const colorMol = esSolucion ? '#c01a1a' : '#000000';

                contenedor.innerHTML = '';

                try {
                    console.log(`  Procesando SMILES: ${smiles}`);
                    
                    const canvasId = `canvas-mol-${index}`;
                    const canvas = document.createElement('canvas');
                    canvas.id = canvasId;
                    canvas.width = ANCHO_MOLECULE;
                    canvas.height = ALTO_MOLECULE;
                    canvas.style.border = '1px solid #ddd';
                    canvas.style.borderRadius = '4px';
                    canvas.style.backgroundColor = '#fafafa';
                    canvas.style.display = 'inline-block';
                    canvas.style.verticalAlign = 'middle';
                    contenedor.appendChild(canvas);

                    // Inicializar el visor estático oficial de ChemDoodle
                    const viewer = new ChemDoodle.ViewerCanvas(canvasId, ANCHO_MOLECULE, ALTO_MOLECULE);
                    
                    // Ajustes visuales para simular fórmulas semidesarrolladas legibles
                    viewer.specs.bonds_useColor = false;
                    viewer.specs.atoms_displayStereo_2D = true;
                    viewer.specs.atoms_displayTerminalCarbons_2D = true;
                    viewer.specs.atoms_displayAllCarbons_2D = true; // Forzar etiquetas de C en vértices
                    viewer.specs.atoms_showImplicitHydrogens_2D = true; // Mostrar H implícitos asociados
                    viewer.specs.bonds_clearLabels = true; // Evitar que el enlace cruce las letras

                    if (colorMol === '#c01a1a') {
                        viewer.specs.atoms_color = colorMol;
                        viewer.specs.bonds_color = colorMol;
                    }

                    const molecule = ChemDoodle.readSMILES(smiles.trim());
                    
                    if (molecule) {
                        viewer.loadMolecule(molecule);
                        conteoMoleculas++;
                        console.log(`    ✓ Molécula dibujada (${conteoMoleculas})`);
                    } else {
                        console.warn(`    ✗ No se pudo parsear: ${smiles}`);
                        contenedor.innerHTML = '<p style="color: red; padding: 10px; font-size: 11px;">Error al parsear SMILES</p>';
                    }

                    contenedor.setAttribute('data-rendered', 'true');
                } catch (error) {
                    console.error(`    ✗ Error en molécula [${smiles}]:`, error.message);
                    contenedor.innerHTML = `<p style="color: red; padding: 10px; font-size: 10px;">Error: ${error.message}</p>`;
                    contenedor.setAttribute('data-rendered', 'true');
                }
            });

            console.log(`✓ Total moléculas dibujadas: ${conteoMoleculas}`);
        }
    </script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #2c3e50;
            background-color: #f0f4f8;
            overflow: hidden; 
        }

        .pagina-completa {
            display: flex;
            flex-direction: column;
            height: 100vh; 
        }

        .zona-menu {
            flex: 0 0 auto; 
            background-color: #ffffff; 
            padding: 15px 3%; 
            border-bottom: 1px solid #d1d8e0;
            z-index: 1000; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h1 {
            margin: 0 0 15px 0; 
            text-align: center;
            font-size: 26px; 
            color: #34495e;
        }

        .contenedor-menus {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px; 
            align-items: center;
            width: 100%;           
            overflow-x: auto;
            padding-bottom: 12px;
            justify-content: flex-start; 
        }

        .menu-desplegable {
            flex: 0 0 auto;
            width: auto; 
            padding: 12px 10px; 
            border-radius: 8px;
            border: 1px solid #ced4da;
            font-size: 15px; 
            font-weight: 600;
            color: #495057;
            background-color: #f8f9fa;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-desplegable:hover {
            border-color: #3498db;
            background-color: #ffffff;
        }

        .menu-desplegable.menu-activo {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.4);
        }

        .zona-lectura {
            flex: 1 1 auto; 
            overflow-y: auto; 
            padding: 10px 5%; 
            background-color: #f1f3f5; 
        }

        #caja-visor {
            background: #ffffff;
            padding: 50px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 6px solid #3498db; 
        }

        #mensaje-inicial {
            text-align: center;
            color: #7f8c8d;
            font-size: 18px;
            padding: 30px;
        }

        #contenido-problema {
            display: none;
        }

        h2 {
            color: #2c3e50;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }

        .controles-solucion {
            margin: 30px 0;
        }

        #btn-solucion {
            padding: 15px 35px; 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s;
        }

        #btn-solucion:hover {
            background-color: #229954;
        }

        #btn-siguiente-paso {
            padding: 15px 35px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin-left: 15px;
        }

        #btn-siguiente-paso:hover:not(:disabled) {
            background-color: #2980b9;
        }

        #btn-siguiente-paso:disabled {
            background-color: #95a5a6;
            cursor: default;
        }

        #caja-solucion {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 5px solid #27ae60;
        }

        #caja-solucion .paso {
            display: none; 
            margin-bottom: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            animation: aparecer 0.4s ease-out;
        }

        #caja-solucion .paso.visible {
            display: block; 
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tabla-ejercicios, .tabla-ejercicios-solucion {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tabla-ejercicios th { background-color: #2c3e50; color: white; padding: 12px; text-align: left; }
        .tabla-ejercicios-solucion th { background-color: #27ae60; color: white; padding: 12px; text-align: left; }
        .tabla-ejercicios td, .tabla-ejercicios-solucion td { padding: 10px; border-bottom: 1px solid #ddd; vertical-align: middle; }
        .tabla-ejercicios td:nth-child(odd) { font-weight: bold; color: #e74c3c; width: 40px; }
        .tabla-ejercicios tr:nth-child(even), .tabla-ejercicios-solucion tr:nth-child(even) { background-color: #f9f9f9; }
        
        [data-smiles] { 
            display: inline-block; 
            min-width: 250px; 
            min-height: 180px; 
            vertical-align: middle;
            background-color: #fafafa;
            border-radius: 4px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div class="pagina-completa">
        <header class="zona-menu">
            <h1>👨‍🏫 Cuaderno de Química - Química del carbono</h1>
            <div class="contenedor-menus">
                <select class="menu-desplegable" id="menu-hidrocarburos"><option value="" disabled selected>📁 1. Hidrocarburos</option></select>
                <select class="menu-desplegable" id="menu-oxigeno"><option value="" disabled selected>📁 2. Compuestos oxigenados y nitrogenados</option></select>
                <select class="menu-desplegable" id="menu-variados"><option value="" disabled selected>📁 3. Compuestos variados</option></select>
            </div>
        </header>

        <main class="zona-lectura">
            <div id="caja-visor">
                <div id="mensaje-inicial"><p>Selecciona un tema arriba para visualizar los problemas.</p></div>
                <div id="contenido-problema">
                    <h2 id="titulo-visor"></h2>
                    <div id="texto-visor"></div>
                    <div class="controles-solucion">
                        <button id="btn-solucion" onclick="toggleSolucion()">Ver Solución</button>
                        <button id="btn-siguiente-paso" onclick="revelarSiguientePaso()" style="display: none;">Siguiente Paso ⬇️</button>
                    </div>
                    <div id="caja-solucion"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function ajustarAnchoSoloTitulo(select) {
            const textoTitulo = select.options[0].text;
            const font = window.getComputedStyle(select).font;
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            context.font = font;
            const width = context.measureText(textoTitulo).width;
            select.style.width = (width + 45) + "px";
        }

        function inicializarMenus() {
            console.log('=== INICIALIZANDO MENÚS ===');
            
            if (typeof baseDatosProblemas === 'undefined') {
                console.error('❌ ERROR: baseDatosProblemas no está definido');
                return;
            }

            const todosLosMenus = document.querySelectorAll('.menu-desplegable');

            for (const categoria in baseDatosProblemas) {
                const selectMenu = document.getElementById(`menu-${categoria}`);
                if (!selectMenu) continue;

                const problemas = baseDatosProblemas[categoria];

                problemas.forEach((prob, index) => {
                    const opcion = document.createElement('option');
                    opcion.value = index;
                    opcion.text = prob.titulo;
                    selectMenu.appendChild(opcion);
                });

                ajustarAnchoSoloTitulo(selectMenu);

                selectMenu.addEventListener('change', function() {
                    if (this.value !== "") {
                        const indice = parseInt(this.value);
                        const prob = baseDatosProblemas[categoria][indice];
                        mostrarEnunciado(prob.titulo, prob.enunciado, prob.solucion);
                        this.selectedIndex = 0;
                        todosLosMenus.forEach(m => m.classList.remove('menu-activo'));
                        this.classList.add('menu-activo');
                    }
                });
            }
        }

        function mostrarEnunciado(titulo, texto, solucionHTML) {
            document.getElementById('mensaje-inicial').style.display = 'none';
            document.getElementById('contenido-problema').style.display = 'block';
            document.getElementById('caja-solucion').style.display = 'none';
            
            const btnSiguiente = document.getElementById('btn-siguiente-paso');
            if (btnSiguiente) btnSiguiente.style.display = 'none';

            document.getElementById('titulo-visor').innerText = titulo;
            document.getElementById('texto-visor').innerHTML = texto;
            
            const btn = document.getElementById('btn-solucion');
            if (solucionHTML) {
                document.getElementById('caja-solucion').innerHTML = solucionHTML;
                btn.style.display = 'inline-block';
                btn.innerText = 'Ver Solución';
            } else {
                btn.style.display = 'none';
            }
            
            MathJax.typesetPromise();
            
            esperarChemDoodle().then(() => {
                setTimeout(() => dibujarMoleculasChemDoodle(), 100);
            });

            document.querySelector('.zona-lectura').scrollTop = 0;
        }

        function toggleSolucion() {
            const caja = document.getElementById('caja-solucion');
            const btn = document.getElementById('btn-solucion');
            const btnSiguiente = document.getElementById('btn-siguiente-paso');

            if (caja.style.display === 'none') {
                caja.style.display = 'block';
                btn.innerText = 'Ocultar Solución';
                btnSiguiente.style.display = 'inline-block';
                btnSiguiente.innerText = "Mostrar primer paso ⬇️";
                btnSiguiente.disabled = false;
                document.querySelectorAll('#caja-solucion .paso').forEach(p => p.classList.remove('visible'));
                
                MathJax.typesetPromise();
                esperarChemDoodle().then(() => {
                    setTimeout(() => dibujarMoleculasChemDoodle(), 100);
                });
            } else {
                caja.style.display = 'none';
                btn.innerText = 'Ver Solución';
                btnSiguiente.style.display = 'none';
            }
        }

        function revelarSiguientePaso() {
            const contenedor = document.getElementById('caja-solucion');
            const boton = document.getElementById('btn-siguiente-paso');
            const siguientePaso = contenedor.querySelector('.paso:not(.visible)');
            
            if (siguientePaso) {
                siguientePaso.classList.add('visible');
                boton.innerText = "Siguiente paso ⬇️";

                MathJax.typesetPromise();
                esperarChemDoodle().then(() => {
                    setTimeout(() => dibujarMoleculasChemDoodle(), 100);
                });

                const pasosRestantes = contenedor.querySelector('.paso:not(.visible)');
                if (!pasosRestantes) {
                    boton.innerText = "¡Solución completada!";
                    boton.disabled = true;
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                esperarChemDoodle().then(() => inicializarMenus());
            });
        } else {
            esperarChemDoodle().then(() => inicializarMenus());
        }
    </script>
</body>
</html>
